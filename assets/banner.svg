<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="360" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#070b14" />
    </linearGradient>

    <!-- Accent Gradients -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="glowGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#9333ea" stop-opacity="0.05" />
    </linearGradient>

    <linearGradient id="glowGrad2" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.05" />
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.65" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.85" />
    </linearGradient>

    <filter id="blurFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="40" />
    </filter>

    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.6" />
    </filter>
  </defs>

  <style>
    @keyframes pulseGlow {
      0%, 100% { transform: scale(1) translate(0px, 0px); opacity: 0.7; }
      50% { transform: scale(1.15) translate(20px, -15px); opacity: 0.95; }
    }
    @keyframes floatPill1 {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-12px) rotate(1.5deg); }
    }
    @keyframes floatPill2 {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(14px) rotate(-1.5deg); }
    }
    @keyframes floatPill3 {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-10px) rotate(-1deg); }
    }
    @keyframes cursorBlink1 {
      0%, 100% { opacity: 0.9; transform: translate(0px, 0px); }
      50% { opacity: 0.3; transform: translate(8px, 4px); }
    }
    @keyframes cursorBlink2 {
      0%, 100% { opacity: 0.2; transform: translate(0px, 0px); }
      50% { opacity: 0.95; transform: translate(-6px, -4px); }
    }
    @keyframes gridFlow {
      0% { stroke-dashoffset: 0; }
      100% { stroke-dashoffset: 40; }
    }

    .bg-pulse {
      animation: pulseGlow 8s ease-in-out infinite;
      transform-origin: center;
    }
    .pill-anim-1 {
      animation: floatPill1 6s ease-in-out infinite;
    }
    .pill-anim-2 {
      animation: floatPill2 7s ease-in-out infinite;
    }
    .pill-anim-3 {
      animation: floatPill3 6.5s ease-in-out infinite;
    }
    .cursor-1 {
      animation: cursorBlink1 3.5s ease-in-out infinite;
    }
    .cursor-2 {
      animation: cursorBlink2 4s ease-in-out infinite;
    }
    .grid-lines {
      stroke: #334155;
      stroke-opacity: 0.25;
      stroke-width: 1;
      stroke-dasharray: 4, 6;
      animation: gridFlow 20s linear infinite;
    }
  </style>

  <!-- Background Layer -->
  <rect width="1200" height="360" fill="url(#bgGrad)" />

  <!-- Animated Ambient Glows (Behind Everything) -->
  <g class="bg-pulse">
    <circle cx="250" cy="120" r="140" fill="url(#glowGrad1)" filter="url(#blurFilter)" />
    <circle cx="950" cy="240" r="160" fill="url(#glowGrad2)" filter="url(#blurFilter)" />
    <circle cx="600" cy="180" r="120" fill="#4f46e5" fill-opacity="0.12" filter="url(#blurFilter)" />
  </g>

  <!-- Dynamic Cyber Grid Pattern -->
  <g class="grid-lines">
    <line x1="0" y1="60" x2="1200" y2="60" />
    <line x1="0" y1="120" x2="1200" y2="120" />
    <line x1="0" y1="180" x2="1200" y2="180" />
    <line x1="0" y1="240" x2="1200" y2="240" />
    <line x1="0" y1="300" x2="1200" y2="300" />
    <line x1="150" y1="0" x2="150" y2="360" />
    <line x1="350" y1="0" x2="350" y2="360" />
    <line x1="550" y1="0" x2="550" y2="360" />
    <line x1="750" y1="0" x2="750" y2="360" />
    <line x1="950" y1="0" x2="950" y2="360" />
    <line x1="1100" y1="0" x2="1100" y2="360" />
  </g>

  <!-- Dynamic Floating Decorative Pills/Cards (Positioned at Edges to keep Center Title Clean & In Foreground) -->
  <g class="pill-anim-1" filter="url(#dropShadow)">
    <rect x="50" y="55" width="230" height="46" rx="23" fill="url(#cardGrad)" stroke="#38bdf8" stroke-width="1.2" stroke-opacity="0.5" />
    <circle cx="75" cy="78" r="8" fill="#10b981" />
    <text x="94" y="83" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#f1f5f9">DOCX • XLSX • PPTX</text>
  </g>

  <g class="pill-anim-2" filter="url(#dropShadow)">
    <rect x="910" y="60" width="240" height="46" rx="23" fill="url(#cardGrad)" stroke="#818cf8" stroke-width="1.2" stroke-opacity="0.5" />
    <circle cx="935" cy="83" r="8" fill="#38bdf8" />
    <text x="954" y="88" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#f1f5f9">CRDT &amp; Live Co-Editing</text>
  </g>

  <g class="pill-anim-3" filter="url(#dropShadow)">
    <rect x="70" y="270" width="220" height="46" rx="23" fill="url(#cardGrad)" stroke="#ec4899" stroke-width="1.2" stroke-opacity="0.5" />
    <circle cx="95" cy="293" r="8" fill="#f43f5e" />
    <text x="114" y="298" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#f1f5f9">Zero-Knowledge &amp; E2EE</text>
  </g>

  <g class="pill-anim-1" filter="url(#dropShadow)">
    <rect x="920" y="265" width="225" height="46" rx="23" fill="url(#cardGrad)" stroke="#10b981" stroke-width="1.2" stroke-opacity="0.5" />
    <circle cx="945" cy="288" r="8" fill="#8b5cf6" />
    <text x="964" y="293" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#f1f5f9">Self-Hosted &amp; Sovereign</text>
  </g>

  <!-- Animated Live Presence Cursors in Background -->
  <g class="cursor-1">
    <path d="M 330,130 L 330,148 L 335,143 L 341,152 L 344,150 L 338,141 L 344,141 Z" fill="#38bdf8" />
    <rect x="345" y="146" width="65" height="18" rx="4" fill="#0284c7" />
    <text x="350" y="159" font-family="sans-serif" font-size="10" font-weight="bold" fill="#ffffff">Alice (Editing)</text>
  </g>
  <g class="cursor-2">
    <path d="M 850,210 L 850,228 L 855,223 L 861,232 L 864,230 L 858,221 L 864,221 Z" fill="#ec4899" />
    <rect x="865" y="226" width="62" height="18" rx="4" fill="#db2777" />
    <text x="870" y="239" font-family="sans-serif" font-size="10" font-weight="bold" fill="#ffffff">Bob (Review)</text>
  </g>

  <!-- FOREGROUND: Distinct Header, Title and Subtitle (Ensured never obstructed) -->
  <g id="foreground-content" filter="url(#dropShadow)">
    <!-- Small Category Pill -->
    <rect x="475" y="62" width="250" height="28" rx="14" fill="#1e293b" stroke="#6366f1" stroke-width="1.5" />
    <text x="600" y="81" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="11" font-weight="700" letter-spacing="1.8" text-anchor="middle" fill="#a5b4fc">CURATED AWESOME SUITE</text>

    <!-- Main Title -->
    <text x="600" y="155" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="37" font-weight="900" letter-spacing="-0.5" text-anchor="middle" fill="url(#textGrad)">Awesome Office Document Collaboration</text>
    
    <text x="600" y="200" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="28" font-weight="800" letter-spacing="0.5" text-anchor="middle" fill="#f8fafc">&amp; Real-Time Co-Authoring</text>

    <!-- Subtitle / Meta Description -->
    <text x="600" y="238" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="14.5" font-weight="400" text-anchor="middle" fill="#94a3b8">The definitive curated collection of enterprise SaaS and sovereign open-source collaborative office platforms</text>
  </g>
</svg>
